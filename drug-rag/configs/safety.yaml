risk_levels:
  low: 常规说明书问答，仍需遵循说明书、处方和药师指导。
  medium: 需要谨慎判断，建议咨询医生或执业药师。
  high: 高风险用药场景，不建议自行购药或用药，必须咨询医生或执业药师。

mandatory_consult_scenarios:
  - 孕妇、备孕或可能妊娠
  - 哺乳期
  - 儿童
  - 老年人合并基础疾病
  - 肝肾功能异常
  - 过敏或疑似严重不良反应
  - 合并使用其他药物
  - 过量或误服

answer_requirements:
  - 关键结论必须来自说明书检索片段。
  - 必须给出来源章节和页码。
  - 找不到依据时必须说明未检索到足够信息。
  - 不得替代医生诊断或给出处方外承诺。
  - 高风险场景必须显式提示咨询医生或执业药师。
